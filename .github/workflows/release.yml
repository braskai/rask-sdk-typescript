name: Release

# Publishes @braskai/rask-sdk to npm when a GitHub Release is published.
# The release tag must be "v" + the version in package.json (e.g. v0.2.0).
# Pre-releases are published under the "next" dist-tag.
#
# Authentication uses npm trusted publishing (OIDC): no npm token is stored in
# GitHub once the trusted publisher is configured for the package on npmjs.com
# (repository braskai/rask-sdk-typescript, workflow release.yml, environment npm).
# The optional NPM_TOKEN secret is only for bootstrapping the very first publish.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11
      - name: Tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - name: Publish
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag "$DIST_TAG"
