name: Release

# Publishes the version in package.json to npm, then tags it and makes the GitHub Release.
# Started by hand and only from the default branch: `gh workflow run release.yml`, or "Run workflow" on the Actions tab.
# So the workflow that publishes is always the reviewed one, and nothing is public before the checks pass.
# npm trusts this workflow itself (trusted publishing, OIDC), so there is no npm token in this repository: on npmjs.com the
# package names this repository, this file and the environment `npm` as its publisher. RELEASING.md has the steps.

on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: the dist-tag of a release depends on what the one before it published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: checks
    runs-on: ubuntu-latest
    # The environment takes only the default branch.
    environment: npm
    permissions:
      contents: write # the tag and the GitHub Release
      id-token: write # what npm exchanges for a publish right, and signs the provenance with
    steps:
      - name: Only from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::A release is cut from $DEFAULT_BRANCH, and this run is on $GITHUB_REF_NAME."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # No dependency cache in the job that may publish: a cache is something another run could have written.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - name: The version is new
        run: |
          version=$(node -p 'require("./package.json").version')
          tagged=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || tagged=$?
          published=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@braskai%2fapi/$version")
          if [ "$tagged" != 2 ] || [ "$published" != 404 ]; then
            echo "::error::$version is already released, or that could not be checked (tag lookup $tagged, where 2 means no tag; npm answered $published). Set the next version in package.json and src/version.ts first."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # A pre-release is `latest` while no stable version exists, so that `npm install @braskai/api` works during the
      # alpha. Once there is a stable version, a pre-release goes out as `next`.
      - name: Choose the dist-tag
        run: |
          latest=$(curl -fsS https://registry.npmjs.org/@braskai%2fapi | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))["dist-tags"].latest ?? ""')
          case "$VERSION" in
            *-*) case "$latest" in *-*) tag=latest ;; *) tag=next ;; esac ;;
            *) tag=latest ;;
          esac
          echo "Publishing $VERSION as $tag (latest is $latest)."
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"
      - run: npm ci
      # `prepack` builds dist.
      - run: npm publish --access public --tag "$DIST_TAG"
      - name: Tag the version and make the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- "v$VERSION" --target "$GITHUB_SHA" --generate-notes
          case "$VERSION" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$@"
