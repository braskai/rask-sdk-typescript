        - `lipsync_enhanced`: the Enhanced lip-sync model
        - `lipsync_download`: download lip-synced video
        - `onscreen`: on-screen text translation and download of its video
        - `voice_clones`: workspace voice clones
        - `instant_voice_clone`: a speaker's own cloned voice
        - `share_links`: revocable project share links
