# What this SDK changes in the contract before generating (an OpenAPI Overlay 1.0 document).
# Open enums: each open enum X (x-rask-open-enum) becomes anyOf [XKnown, string], so a value this version does not know
# survives in a response. Request-side references switch to XKnown, so requests stay closed.
# Unknown union variants (x-rask-open-union) are kept by the hand-written layer.
# Idempotency-Key is optional in SDK signatures: the SDK generates a UUIDv4 per call and keeps it across retries.
# It names every open enum of the contract, so it changes with them: `npm run generate` stops on a target it cannot find.
overlay: 1.0.0
info:
  title: 'Rask API v3: SDK fallback generators (hey-api, openapi-python-client, Kiota)'
  version: 1.0.0
