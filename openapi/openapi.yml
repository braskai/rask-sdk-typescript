components:
  schemas:
    ProjectCreate:
      properties:
        video_id:
          type: string
          format: uuid
          title: Video ID
          description: Uploaded media ID with video kind
        name:
          anyOf:
            - type: string
            - type: 'null'
          description: Optional project name (will be autogenerated if empty)
          title: Project name
        src_lang:
          anyOf:
            - type: string
            - type: 'null'
          title: Source language
          description: This parameter is optional and will be defined automatically if left empty. If specified, must be defined without the dialect, for example `en` instead of `en-us`. See the [list of source languages](/languages) available.
        dst_lang:
          type: string
          title: Destination language
          description: Destination language
        num_speakers:
          anyOf:
            - type: integer
            - type: 'null'
          title: Number of speakers
          description: Optional number of speakers (will be defined automatically if empty)
        transcript_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Transcript ID
          description: Optional ID of uploaded transcription
        glossary_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Glossary ID
          description: Optional ID of created glossary
      type: object
      required:
        - video_id
        - dst_lang
      title: ProjectCreate
    ProjectGet:
      properties:
        id:
          type: string
          format: uuid
          title: Project ID
          description: Project ID
        name:
          type: string
          title: Project name
          description: Project name
        source_type:
          $ref: '#/components/schemas/SourceType'
        status:
          anyOf:
            - $ref: '#/components/schemas/ProjectStatus'
            - type: 'null'
        status_updated_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Project status updated at
          description: Date and time of the last project status update
        created_at:
          type: string
          format: date-time
          title: Project created at
          description: Date and time of project creation
        cover:
          anyOf:
            - type: string
            - type: 'null'
          title: Project cover image
          description: Cover image of video specified
        src_lang:
          anyOf:
            - type: string
            - type: 'null'
          title: Project source language
          description: Project source language
        dst_lang:
          anyOf:
            - type: string
            - type: 'null'
          title: Project destination language
          description: Project destination language
        num_speakers:
          anyOf:
            - type: integer
            - type: 'null'
          title: Number of speakers in the project
          description: Number of speakers in the project
        source_url:
          anyOf:
            - type: string
            - type: 'null'
          title: Video source url
          description: Video source url if media has been created by link
        duration:
          anyOf:
            - type: integer
            - type: 'null'
          title: Video duration
          description: Video duration after limits applied
        original_duration:
          anyOf:
            - type: integer
            - type: 'null'
          title: Original video duration
          description: Original video duration
        glossary_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Glossary ID
          description: Glossary ID (if glossary is used)
        glossary_version:
          anyOf:
            - type: integer
            - type: 'null'
          title: Glossary version
          description: Glossary version (if glossary is used)
        original_video:
          anyOf:
            - type: string
            - type: 'null'
          title: Original video link
          description: Link to the original video stored
        transcript_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Project transcription ID
          description: Project transcription ID
        voiceover:
          anyOf:
            - type: string
            - type: 'null'
          title: Voiceover link
          description: Link to the translated audio with voiceover only
        translated_video:
          anyOf:
            - type: string
            - type: 'null'
          title: Translated video link
          description: Link to the translated video
        translated_audio:
          anyOf:
            - type: string
            - type: 'null'
          title: Translated audio link
          description: Link to the translated audio (voiceover with background)
        voice:
          anyOf:
            - additionalProperties:
                anyOf:
                  - type: string
                  - type: 'null'
              type: object
            - type: 'null'
          title: Voices
          description: Pull of voices detected
        translation_srt_path:
          anyOf:
            - type: string
            - type: 'null'
          title: Translation .srt link
          description: Link to the translation .srt
        translation_vtt_path:
          anyOf:
            - type: string
            - type: 'null'
          title: Translation .vtt link
          description: Link to the translation .vtt
      type: object
      required:
        - id
        - name
        - source_type
        - created_at
      title: ProjectGet
    ProjectListItemGet:
      properties:
        id:
          type: string
          format: uuid
          title: Project ID
          description: Project ID
        name:
          type: string
          title: Project name
          description: Project name
        source_type:
          $ref: '#/components/schemas/SourceType'
        status:
          anyOf:
            - $ref: '#/components/schemas/ProjectStatus'
            - type: 'null'
        status_updated_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Project status updated at
          description: Date and time of the last project status update
        created_at:
          type: string
          format: date-time
          title: Project created at
          description: Date and time of project creation
      type: object
      required:
        - id
        - name
        - source_type
        - created_at
      title: ProjectListItemGet
    ProjectListGet:
      properties:
        total:
          type: integer
          title: Total number of projects
          description: Total number of projects
        offset:
          type: integer
          title: Projects offset
          description: Project offset number
        projects:
          items:
            $ref: '#/components/schemas/ProjectListItemGet'
          type: array
          title: Project list
          description: Project list
      type: object
      required:
        - total
        - offset
        - projects
      title: ProjectListGet
    ProjectPatch:
      properties:
        name:
          anyOf:
            - type: string
            - type: 'null'
          title: Project name
          description: Project name
        num_speakers:
          anyOf:
            - type: integer
            - type: 'null'
          title: Number of speakers in the project
          description: Number of speakers in the project
        voice:
          anyOf:
            - additionalProperties:
                type: string
                format: uuid
              type: object
            - type: 'null'
          title: Project voices
          description: Map with speaker identifiers (e.g. SPEAKER_00) as keys and voice ids as values
      type: object
      title: ProjectPatch
    MediaCreateFile:
      properties:
        name:
          type: string
          title: Media name
          description: Media name
        data:
          type: string
          format: binary
          title: Media data
          description: Media data
      type: object
      required:
        - data
      title: MediaCreateFile
    TranscriptionCreateFile:
      properties:
        src:
          anyOf:
            - type: string
              format: binary
            - type: 'null'
          title: Source .srt file
          description: Source .srt file
        dst:
          anyOf:
            - type: string
              format: binary
            - type: 'null'
          title: Destination .srt file
          description: Destination .srt file
      type: object
      title: TranscriptionCreateFile
    ProjectStatus:
      description: Current project status
      type: string
      enum:
        - created
        - uploading
        - uploaded
        - upload_failed
        - transcription_started
        - transcription_done
        - transcription_failed
        - transcribe_segments_started
        - transcribe_segments_done
        - transcribe_segments_failed
        - separate_background_started
        - separate_background_done
        - separate_background_failed
        - determine_speakers_started
        - determine_speakers_done
        - determine_speakers_failed
        - voice_suggest_started
        - voice_suggest_done
        - voice_suggest_failed
        - translation_started
        - translation_done
        - translation_failed
        - voice_update_started
        - voice_update_done
        - voice_update_failed
        - transcript_edited
        - voice_edited
        - voiceover_started
        - voiceover_done
        - voiceover_failed
        - merging_started
        - merging_done
        - merging_failed
        - failed
        - no_audio
        - no_words
        - forbidden_link
      title: ProjectStatus
    SourceType:
      description: Source of uploaded content
      type: string
      enum:
        - youtube
        - gdrive
        - vimeo
        - s3
        - local
        - any
      title: SourceType
    MediaSlimGet:
      properties:
        kind:
          $ref: '#/components/schemas/MediaKind'
        status:
          $ref: '#/components/schemas/MediaStatus'
        mime_type:
          type: string
          title: Media mime type
          description: Media mime type
        user_id:
          type: string
          format: uuid
          title: Author ID
          description: Author ID
        meta:
          anyOf:
            - $ref: '#/components/schemas/VideoMeta'
            - $ref: '#/components/schemas/AudioMeta'
            - $ref: '#/components/schemas/ImageMeta'
            - type: object
              additionalProperties: true
          title: Meta
          description: 'Media metadata. While media is processing or after a failure it is an arbitrary object, for example `{"source": "<link>"}` or `{"error": "<reason>"}`.'
        name:
          anyOf:
            - type: string
            - type: 'null'
          title: Media name
          description: Name of media uploaded
        id:
          type: string
          format: uuid
          title: Media ID
          description: ID of media uploaded
        created_at:
          type: string
          format: date-time
          title: Media created at
          description: Date and time of media creation
        updated_at:
          type: string
          format: date-time
          title: Media updated at
          description: Date and time of the last media update
        path:
          type: string
          title: Media path
          description: Path to the media
        url:
          anyOf:
            - type: string
              minLength: 1
              format: uri
            - type: 'null'
          title: Media url
          description: Media url
        preview_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Preview ID
          description: ID of the media preview (if any)
        deleted_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Media deleted at
          description: Date and time of media deletion (if deleted)
      type: object
      required:
        - kind
        - status
        - mime_type
        - user_id
        - meta
        - id
        - created_at
        - updated_at
        - path
      title: MediaSlimGet
    MediaCreateFromLink:
      properties:
        link:
          type: string
          minLength: 1
          format: uri
          title: Media link
          description: Media link
        kind:
          anyOf:
            - $ref: '#/components/schemas/MediaKind'
            - type: 'null'
        name:
          anyOf:
            - type: string
            - type: 'null'
          title: Media name
          description: Media name
      type: object
      required:
        - link
      title: MediaCreateFromLink
    MediaGet:
      properties:
        kind:
          $ref: '#/components/schemas/MediaKind'
        status:
          $ref: '#/components/schemas/MediaStatus'
        mime_type:
          type: string
          title: Media mime type
          description: Media mime type
        user_id:
          type: string
          format: uuid
          title: Author ID
          description: Author ID
        meta:
          anyOf:
            - $ref: '#/components/schemas/VideoMeta'
            - $ref: '#/components/schemas/AudioMeta'
            - $ref: '#/components/schemas/ImageMeta'
            - type: object
              additionalProperties: true
          title: Meta
          description: 'Media metadata. While media is processing or after a failure it is an arbitrary object, for example `{"source": "<link>"}` or `{"error": "<reason>"}`.'
        name:
          anyOf:
            - type: string
            - type: 'null'
          title: Media name
          description: Name of media uploaded
        id:
          type: string
          format: uuid
          title: Media ID
          description: ID of media uploaded
        created_at:
          type: string
          format: date-time
          title: Media created at
          description: Date and time of media creation
        updated_at:
          type: string
          format: date-time
          title: Media updated at
          description: Date and time of the last media update
        path:
          type: string
          title: Media path
          description: Path to the media
        url:
          anyOf:
            - type: string
              minLength: 1
              format: uri
            - type: 'null'
          title: Media url
          description: Media url
        preview_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Preview ID
          description: ID of the media preview (if any)
        deleted_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Media deleted at
          description: Date and time of media deletion (if deleted)
        preview:
          anyOf:
            - $ref: '#/components/schemas/MediaSlimGet'
            - type: 'null'
      type: object
      required:
        - kind
        - status
        - mime_type
        - user_id
        - meta
        - id
        - created_at
        - updated_at
        - path
      title: MediaGet
    MediaKind:
      type: string
      enum:
        - video
        - audio
        - image
      title: MediaKind
      description: Kind of media uploaded
    MediaStatus:
      type: string
      enum:
        - processing
        - ready
        - failed
      title: MediaStatus
      description: Status of media uploaded
    VideoMeta:
      properties:
        size_bytes:
          type: integer
          title: Media video size
          description: Media video size in bytes
        original_meta:
          anyOf:
            - type: object
            - type: 'null'
          title: Media original meta
          description: Media original meta object
        duration_seconds:
          type: integer
          title: Media video duration
          description: Media video duration in seconds
        audio_rate:
          type: integer
          title: Media audio rate
          description: Media audio rate
        audio_layout:
          type: string
          enum:
            - mono
            - stereo
          title: Media audio layout
          description: Media audio layout
        audio_channels:
          type: integer
          title: Media audio channels
          description: Number of media audio channels
        audio_codec_name:
          type: string
          title: Media audio codec name
          description: Media audio codec name
        video_codec_name:
          type: string
          title: Media video codec name
          description: Media video codec name
        video_frame_rate:
          type: integer
          title: Media video frame rate
          description: Media video frame rate
        video_frame_width:
          type: integer
          title: Media video frame width
          description: Media video frame width
        video_frame_height:
          type: integer
          title: Media video frame height
          description: Media video frame height
      type: object
      required:
        - size_bytes
        - duration_seconds
        - audio_rate
        - audio_layout
        - audio_channels
        - audio_codec_name
        - video_codec_name
        - video_frame_rate
        - video_frame_width
        - video_frame_height
      title: VideoMeta
    AudioMeta:
      properties:
        size_bytes:
          type: integer
          title: Media audio size
          description: Media audio size in bytes
        original_meta:
          anyOf:
            - type: object
            - type: 'null'
          title: Media original meta
          description: Media original meta object
        duration_seconds:
          type: integer
          title: Media audio duration
          description: Media audio duration in seconds
        audio_rate:
          type: integer
          title: Media audio rate
          description: Media audio rate
        audio_layout:
          type: string
          enum:
            - mono
            - stereo
          title: Media audio layout
          description: Media audio layout
        audio_channels:
          type: integer
          title: Media audio channels
          description: Number of media audio channels
        audio_codec_name:
          type: string
          title: Media audio codec name
          description: Media audio codec name
      type: object
      required:
        - size_bytes
        - duration_seconds
        - audio_rate
        - audio_layout
        - audio_channels
        - audio_codec_name
      title: AudioMeta
    ImageMeta:
      properties:
        size_bytes:
          type: integer
          title: Media image size
          description: Media image size in bytes
        original_meta:
          anyOf:
            - type: object
            - type: 'null'
          title: Media original meta
          description: Media original meta object
        image_width:
          type: integer
          title: Media image width
          description: Media image width
        image_height:
          type: integer
          title: Media image height
          description: Media image height
        image_format:
          type: string
          title: Media image format
          description: Media image format
      type: object
      required:
        - size_bytes
        - image_width
        - image_height
        - image_format
      title: ImageMeta
    SegmentCreate:
      properties:
        src:
          anyOf:
            - $ref: '#/components/schemas/SegmentTextCreatePatch'
            - type: 'null'
        dst:
          anyOf:
            - $ref: '#/components/schemas/SegmentTextCreatePatch'
            - type: 'null'
        speaker:
          anyOf:
            - type: string
            - type: 'null'
          title: Speaker identifier
          description: Speaker identifier. Must be specified in `SPEAKER_XX` format (case-sensitive), where `XX` corresponds to Speaker's index, starting with 00.
        start:
          type: string
          title: Segment start time
          description: Segment start time. Must be valid `HH:MM:SS,mmm` timestamp
        end:
          type: string
          title: Segment end time
          description: Segment end time. Must be valid `HH:MM:SS,mmm` timestamp
      type: object
      required:
        - start
        - end
      title: SegmentCreate
    SegmentGet:
      properties:
        src:
          anyOf:
            - $ref: '#/components/schemas/SegmentText'
            - type: 'null'
        dst:
          anyOf:
            - $ref: '#/components/schemas/SegmentText'
            - type: 'null'
        speaker:
          anyOf:
            - type: string
            - type: 'null'
          title: Speaker identifier
          description: Speaker identifier. Must be specified in `SPEAKER_XX` format (case-sensitive), where `XX` corresponds to Speaker's index, starting with 00.
        start:
          type: string
          title: Segment start time
          description: Segment start time. Must be valid `HH:MM:SS,mmm` timestamp
        end:
          type: string
          title: Segment end time
          description: Segment end time. Must be valid `HH:MM:SS,mmm` timestamp
        id:
          type: string
          title: Segment ID
          description: Segment ID
        status:
          $ref: '#/components/schemas/SegmentStatus'
      type: object
      required:
        - start
        - end
        - id
        - status
      title: SegmentGet
    SegmentStatus:
      type: string
      enum:
        - processing
        - updated
        - done
        - error
      title: SegmentStatus
      description: Segment status
    SegmentText:
      properties:
        text:
          type: string
          title: Segment text
          description: Segment text
        lang:
          anyOf:
            - type: string
            - type: 'null'
          title: Segment language
          description: Segment language
      type: object
      required:
        - text
      title: SegmentText
    SegmentTextCreatePatch:
      properties:
        text:
          type: string
          title: Segment text
          description: Segment text
        lang:
          type: string
          title: Segment language
          description: Segment language, without the dialect (for example `en` instead of `en-us`)
      type: object
      required:
        - text
        - lang
      title: SegmentTextCreatePatch
    TranscriptionCreate:
      properties:
        segments:
          items:
            $ref: '#/components/schemas/SegmentCreate'
          type: array
          title: List of segments
          description: List of segments. The segment source language must be defined without the dialect, for example `en` instead of `en-us`. See the [list of source languages](/languages) available.
      type: object
      required:
        - segments
      title: TranscriptionCreate
    TranscriptionGet:
      properties:
        segments:
          items:
            $ref: '#/components/schemas/SegmentGet'
          type: array
          title: List of segments
          description: List of segments
      type: object
      required:
        - segments
      title: TranscriptionGet
    TranscriptionId:
      properties:
        segments:
          items:
            $ref: '#/components/schemas/SegmentGet'
          type: array
          title: List of segments
          description: List of segments
        id:
          type: string
          format: uuid
          title: Transcription ID
          description: Transcription ID
      type: object
      required:
        - segments
        - id
      title: TranscriptionId
    TranscriptionSegmentsCreate:
      properties:
        segments:
          items:
            $ref: '#/components/schemas/SegmentCreate'
          type: array
          title: Segments
          description: List of segments to add to the existing project transcription
      type: object
      required:
        - segments
      title: TranscriptionSegmentsCreate
    TranscriptionSegmentsPatch:
      properties:
        segments:
          items:
            $ref: '#/components/schemas/SegmentPatch'
          type: array
          title: Segments
          description: List of project transcription segments to update. Only the fields that need to be updated must be specified.
      type: object
      required:
        - segments
      title: TranscriptionSegmentsPatch
    SegmentId:
      properties:
        id:
          type: string
          title: Segment ID
          description: Segment ID
      type: object
      required:
        - id
      title: SegmentId
    SegmentPatch:
      properties:
        id:
          type: string
          title: Segment ID
          description: Segment ID
        src:
          anyOf:
            - $ref: '#/components/schemas/SegmentTextCreatePatch'
            - type: 'null'
        dst:
          anyOf:
            - $ref: '#/components/schemas/SegmentTextCreatePatch'
            - type: 'null'
        speaker:
          anyOf:
            - type: string
            - type: 'null'
          title: Speaker identifier
          description: Speaker identifier. Must be specified in `SPEAKER_XX` format (case-sensitive), where `XX` corresponds to Speaker's index, starting with 00.
        start:
          anyOf:
            - type: string
            - type: 'null'
          title: Segment start time
          description: Segment start time. Must be valid `HH:MM:SS,mmm` timestamp
        end:
          anyOf:
            - type: string
            - type: 'null'
          title: Segment end time
          description: Segment end time. Must be valid `HH:MM:SS,mmm` timestamp
      type: object
      required:
        - id
      title: SegmentPatch
    CheckFaceTaskResponse:
      properties:
        check_face_task_status:
          anyOf:
            - $ref: '#/components/schemas/CheckFaceTaskStatus'
            - type: 'null'
          title: Check Face Task Status
          description: Check Face Task Status
      type: object
      title: CheckFaceTaskResponse
    CheckFaceTaskStatus:
      type: string
      enum:
        - started
        - done
        - failed
      title: CheckFaceTaskStatus
      description: Status of the check face task
    LipsyncTaskStatus:
      type: string
      enum:
        - started
        - done
        - failed
        - outdated
      title: LipsyncTaskStatus
      description: Status of the lip-sync task. `outdated` means the project changed after lip-sync finished and it has to be run again.
    LipsyncTaskData:
      properties:
        is_multiple_speakers:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Is multiple speakers present
          description: Whether the video always has one face on screen at a time, or multiple. If unsure, set to `true`.
        is_free_lipsync:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Is free lip-sync
          description: If specified, free lip-sync credits will be charged instead of minutes
      type: object
      title: LipsyncTaskData
    LipsyncTaskResponse:
      properties:
        tasks_in_lipsync_queue:
          anyOf:
            - type: integer
            - type: 'null'
          title: Tasks in lip-sync queue
          description: Number of tasks in the lip-sync queue before your project
        lipsync_task_status:
          anyOf:
            - $ref: '#/components/schemas/LipsyncTaskStatus'
            - type: 'null'
          title: Lip-sync task status
          description: Lip-sync task status
      type: object
      title: LipsyncTaskResponse
    LipsyncInfo:
      properties:
        check_face_task_status:
          anyOf:
            - $ref: '#/components/schemas/CheckFaceTaskStatus'
            - type: 'null'
          title: Check face task status
          description: Check face task status
        tasks_in_lipsync_queue:
          anyOf:
            - type: integer
            - type: 'null'
          title: Tasks in lip-sync queue
          description: Number of tasks in the lip-sync queue before your project
        lipsync_result_path:
          anyOf:
            - type: string
            - type: 'null'
          title: Lipsync result link
          description: Link to the lip-synced video result
        lipsync_task_status:
          anyOf:
            - $ref: '#/components/schemas/LipsyncTaskStatus'
            - type: 'null'
          title: Lipsync task status
          description: Lipsync task status
        video_has_face:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Is video has face
          description: If video has face
        lipsync_task_progress:
          anyOf:
            - type: integer
            - type: 'null'
          title: Lip-sync task progress
          description: Lip-sync task progress
      type: object
      title: LipsyncInfo
    CreditItem:
      properties:
        total:
          type: integer
          title: Credit total
          description: Total credits available
        used:
          type: integer
          title: Credit used
          description: Used credits
      type: object
      required:
        - total
        - used
      title: CreditItem
    Credits:
      properties:
        minutes:
          $ref: '#/components/schemas/CreditItem'
        video:
          $ref: '#/components/schemas/CreditItem'
        lipsync_free_minutes:
          $ref: '#/components/schemas/CreditItem'
      type: object
      required:
        - minutes
        - video
        - lipsync_free_minutes
      title: Credits
    GlossaryCreate:
      properties:
        name:
          type: string
          title: Glossary name
          description: Glossary name
        src_lang:
          type: string
          title: Glossary source language
          description: Glossary source language
        dst_lang:
          type: string
          title: Glossary destination language
          description: Glossary destination language
        entries:
          additionalProperties:
            type: string
          type: object
          title: Glossary entries
          description: Glossary entries
      type: object
      required:
        - name
        - src_lang
        - dst_lang
        - entries
      title: GlossaryCreate
    GlossaryGet:
      properties:
        id:
          type: string
          title: Glossary ID
          description: Glossary ID
        name:
          type: string
          title: Glossary name
          description: Glossary name
        version:
          type: integer
          title: Glossary version
          description: Glossary version
        src_lang:
          type: string
          title: Glossary source language
          description: Glossary source language
        dst_lang:
          type: string
          title: Glossary destination language
          description: Glossary destination language
        entries:
          additionalProperties:
            type: string
          type: object
          title: Glossary entries
          description: Glossary entries
      type: object
      required:
        - id
        - name
        - version
        - src_lang
        - dst_lang
        - entries
      title: GlossaryGet
    GlossaryUpdate:
      properties:
        name:
          type: string
          title: Glossary name
          description: Glossary name
        entries:
          additionalProperties:
            type: string
          type: object
          title: Glossary entries
          description: Glossary entries
      type: object
      required:
        - name
        - entries
      title: GlossaryUpdate
    GlossaryIdGet:
      properties:
        id:
          type: string
          title: Glossary ID
          description: Glossary ID
      type: object
      required:
        - id
      title: GlossaryIdGet
    Voice:
      properties:
        id:
          type: string
          title: Voice ID
          description: Voice ID
        label:
          type: string
          title: Voice label
          description: Voice label
        sample_src:
          anyOf:
            - type: string
            - type: 'null'
          title: Voice sample link
          description: Voice sample link
        gender:
          type: string
          title: Voice gender
          description: Voice gender
      type: object
      required:
        - id
        - label
        - gender
      title: Voice
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    MediaCreateAPIResponseBadRequest:
      properties:
        status:
          $ref: '#/components/schemas/MediaCreateBadRequestStatus'
        status_code:
          type: integer
          title: Status Code
          default: 400
        detail:
          type: string
          title: Detail
      type: object
      required:
        - status
        - status_code
        - detail
      title: MediaCreateAPIResponseBadRequest
    MediaCreateBadRequestStatus:
      type: string
      enum:
        - failed_to_parse_request
        - client_request_closed
        - upload_storage_error
        - download_error
        - unacceptable_error
        - unacceptable_upload_mime_type
        - unacceptable_media_kind
        - unacceptable_format
        - broken_media
        - transcode_aborted
        - transcode_failed
        - transcode_timeout
        - set_metadata_failed
      title: MediaCreateBadRequestStatus
    APIResponseNotFound:
      properties:
        status:
          type: string
          title: Status
          default: not_found
        status_code:
          type: integer
          title: Status Code
          default: 404
        detail:
          type: string
          title: Detail
      type: object
      required:
        - status
        - status_code
        - detail
      title: APIResponseNotFound
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  title: Rask API documentation
  version: 0.2.0
openapi: 3.1.0
paths:
  /api/library/v1/media:
    post:
      tags:
        - media
      summary: Upload media by file
      operationId: createMediaFile
      security:
        - HTTPBearer: [ ]
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/MediaKind'
            title: Kind
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaCreateFile'
      responses:
        '200':
          description: Create media upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGet'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaCreateAPIResponseBadRequest'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/library/v1/media/link:
    post:
      tags:
        - media
      summary: Upload media by link
      operationId: createMediaLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaCreateFromLink'
        required: true
      responses:
        '200':
          description: Upload media from link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGet'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaCreateAPIResponseBadRequest'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: [ ]
  /api/library/v1/media/{media_id}:
    get:
      tags:
        - media
      summary: Get media
      operationId: getMedia
      security:
        - HTTPBearer: [ ]
      parameters:
        - name: media_id
          description: ID of the media uploaded
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Media ID
      responses:
        '200':
          description: Requested media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaGet'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseNotFound'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/projects:
    get:
      tags:
        - projects
      summary: Get project list
      description: Get paginated list of projects with optional filter by name.
      operationId: getProjects
      parameters:
        - name: offset
          in: query
          required: true
          description: Offset from which to start listing projects.
          schema:
            type: integer
        - name: limit
          in: query
          required: true
          description: Number of projects to retrieve.
          schema:
            type: integer
        - name: name
          in: query
          required: false
          description: Filter projects by name (case-insensitive substring match).
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListGet'
      security:
        - HTTPBearer: [ ]
    post:
      tags:
        - projects
      summary: Create project
      description: Create new project with media uploaded by library.
      operationId: createProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: [ ]

  /v2/projects/{project_id}:
    patch:
      tags:
        - projects
      summary: Patch project
      description: Patch project.
      operationId: patchProject
      security:
        - HTTPBearer: [ ]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project ID
            description: ID of the project patched
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: Patched project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
        - projects
      summary: Get project
      description: Get project by project id provided.
      operationId: getProject
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project ID
            description: ID of the project created
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: [ ]

  /v2/projects/{project_id}/transcription:
    get:
      tags:
        - projects
      summary: Get transcription
      description: Get transcription of project specified.
      operationId: getProjectTranscription
      security:
        - HTTPBearer: [ ]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project ID
            description: Project ID
        - name: segment_ids
          in: query
          required: false
          schema:
            anyOf:
              - type: array
                items:
                  type: string
                  format: uuid
              - type: 'null'
            title: Segment IDs
            description: List of segment ids to select
      responses:
        '200':
          description: Project transcription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionGet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/transcriptions:
    post:
      tags:
        - projects
      summary: Create transcription
      description: Create new transcription.
      operationId: createTranscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptionCreate'
        required: true
      responses:
        '200':
          description: Created transcription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionId'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: [ ]

  /v2/projects/{project_id}/transcription/segments:
    post:
      tags:
        - projects
      summary: Add segments
      description: Add new segments to existing project transcription.
      operationId: addProjectTranscriptionSegments
      security:
        - HTTPBearer: [ ]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptionSegmentsCreate'
      responses:
        '200':
          description: Added transcription segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionGet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
        - projects
      summary: Patch segments
      description: Patch existing project transcription segments.
      operationId: patchProjectTranscriptionSegments
      security:
        - HTTPBearer: [ ]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project ID
            description: Project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptionSegmentsPatch'
      responses:
        '200':
          description: Patched transcription segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionGet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/projects/{project_id}/transcription/segments/{segment_id}:
    delete:
      tags:
        - projects
      summary: Delete segment
      description: Delete project transcription segment.
      operationId: deleteProjectTranscriptionSegment
      security:
        - HTTPBearer: [ ]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project ID
            description: Project ID
        - name: segment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Segment ID
            description: Segment ID
      responses:
        '200':
          description: ID of deleted segment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentId'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/transcriptions/srt:
    post:
      tags:
        - projects
      summary: Create transcription srt
      description: Create new transcription from .srt files provided.
      operationId: createTranscriptionSrt
      security:
        - HTTPBearer: [ ]
      parameters:
        - name: src_lang
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Source language
            description: Should be specified only if src .srt file provided. The source language must be defined without the dialect, for example `en` instead of `en-us`. See the [list of source languages](/languages) available.
        - name: dst_lang
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: Destination language
            description: Should be specified only if dst .srt file provided.
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/TranscriptionCreateFile'
              title: Body
              description: At least one of src or dst .srt file has to be provided
      responses:
        '200':
          description: Created transcription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionId'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/projects/{project_id}/generate:
    post:
      tags:
        - projects
      summary: Generate project
      description: Translate project with updated transcription.
      operationId: generateProject
      security:
        - HTTPBearer: [ ]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project ID
            description: Project ID
      responses:
        '200':
          description: Project with up to date translation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/projects/{project_id}/voices:
    get:
      tags:
        - projects
      summary: Get project voices
      description: Get list of project voices.
      operationId: getProjectVoices
      security:
        - HTTPBearer: [ ]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project ID
            description: Project ID
      responses:
        '200':
          description: Voice list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Voice'
                title:  Voice list
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/credits:
    get:
      tags:
        - users
      summary: Get credits
      description: Get user credits.
      operationId: getCredits
      responses:
        '200':
          description: User credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credits'
      security:
        - HTTPBearer: [ ]
  /v2/glossaries:
    post:
      tags:
        - glossaries
      summary: Create glossary
      description: Create new glossary.
      operationId: createGlossary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlossaryCreate'
        required: true
      responses:
        '200':
          description: Created glossary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryGet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
  /v2/glossaries/{glossary_id}:
    get:
      tags:
        - glossaries
      summary: Get glossary
      description: Get glossary.
      operationId: getGlossary
      security:
        - HTTPBearer: [ ]
      parameters:
        - name: glossary_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Glossary ID
            description: Glossary ID
      responses:
        '200':
          description: Requested glossary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryGet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
        - glossaries
      summary: Updated glossary
      description: Update existing glossary.
      operationId: updateGlossary
      security:
        - HTTPBearer: [ ]
      parameters:
        - name: glossary_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Glossary ID
            description: Glossary ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlossaryUpdate'
      responses:
        '200':
          description: Updated glossary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryGet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
        - glossaries
      summary: Delete glossary
      description: Delete glossary by id.
      operationId: deleteGlossary
      security:
        - HTTPBearer: [ ]
      parameters:
        - name: glossary_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Glossary ID
            description: Glossary ID
      responses:
        '200':
          description: ID of glossary deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryIdGet'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/projects/{project_id}/check_face:
    put:
      tags:
        - projects
      summary: Run check face
      description: Run check face task for project id provided.
      operationId: runCheckFaceTask
      security:
        - HTTPBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project ID
            description: Project ID
      responses:
        '200':
          description: Check face task response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckFaceTaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /v2/projects/{project_id}/lipsync:
    put:
      tags:
        - projects
      summary: Run Lip-sync
      description: Run lip-sync task for project id provided.
      operationId: runLipsyncTask
      security:
        - HTTPBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project ID
            description: Project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LipsyncTaskData'
      responses:
        '200':
          description: Lip-sync task response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LipsyncTaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
        - projects
      summary: Get Lip-sync info
      description: Get lip-sync info.
      operationId: getLipsyncInfo
      security:
        - HTTPBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project ID
            description: Project ID
      responses:
        '200':
          description: Lip-sync info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LipsyncInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

servers:
- description: API
  url: https://api.rask.ai

